apiVersion: v1
kind: Secret
metadata:
  name: meeting-minutes-secrets
  namespace: meeting-minutes
type: Opaque
stringData:
  TENANT_ID: "<tenant-id>"
  CLIENT_ID: "<client-id>"
  CLIENT_SECRET: "<client-secret>"
  BLOB_CONNECTION_STRING: "<blob-connection-string>"
  LLAMA_ENDPOINT: "<databricks-endpoint>"
  DATABRICKS_TOKEN: "<databricks-token>"
  HF_TOKEN: "<huggingface-token>"
  MEETING_API_KEY: "<internal-api-key>"
