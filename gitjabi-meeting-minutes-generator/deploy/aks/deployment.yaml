apiVersion: apps/v1
kind: Deployment
metadata:
  name: meeting-minutes-api
  namespace: meeting-minutes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meeting-minutes-api
  template:
    metadata:
      labels:
        app: meeting-minutes-api
    spec:
      containers:
        - name: meeting-minutes-api
          image: <acr-name>.azurecr.io/meeting-minutes-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: meeting-minutes-config
            - secretRef:
                name: meeting-minutes-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "8Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
